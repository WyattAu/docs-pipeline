[package]
name = "docs-pipeline"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Markdown rendering and tree-sitter syntax highlighting pipeline for documentation sites"
repository = "https://github.com/WyattAu/docs-pipeline"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "syntax-highlighting", "tree-sitter", "docs"]
categories = ["text-processing", "development-tools"]
exclude = ["/target"]

[dependencies]
pulldown-cmark = "0.13"

# HTML sanitization
ammonia = "4"

# LaTeX rendering
katex = "0.4"

# Wikilink / TOC / embed pre-processing
regex = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling & logging
thiserror = "2"
tracing = "0.1"

# Sync primitives (LaTeX render cache)
parking_lot = "0.12"

# Syntax highlighting
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.5", optional = true }

[features]
default = [
    "lang-rust",
    "lang-python",
    "lang-javascript",
    "lang-typescript",
    "lang-json",
    "lang-yaml",
    "lang-html",
    "lang-css",
    "lang-bash",
    "lang-toml",
    "lang-markdown",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-json = ["dep:tree-sitter-json"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-bash = ["dep:tree-sitter-bash"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-markdown = ["dep:tree-sitter-md"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
